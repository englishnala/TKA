:root {
  --ink: #26262e; --muted: #5d5d6b;
  --teal: #0d7377; --teal-dark: #0a5a5d; --teal-bg: #e8f5f5;
  --coral: #b3342a; --coral-bg: #fdecea;
  --purple: #6a4c93; --purple-bg: #f2edf8;
  --yellow: #f4b400; --yellow-bg: #fff7d6; --yellow-ink: #6b4b00;
  --green: #1f7a3d; --green-bg: #e6f5ea;
  --paper: #fffdf8; --card: #ffffff; --line: #e4dfd2;
  --radius: 14px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 130px; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: 'Comic Neue', 'Comic Sans MS', system-ui, sans-serif;
  font-size: 1.0625rem; line-height: 1.6;
}
h1, h2, h3 { font-family: 'Patrick Hand', 'Comic Neue', cursive; font-weight: 400; margin: 0; line-height: 1.2; }
button, input, select { font: inherit; color: inherit; }
.wrap { max-width: 860px; margin: 0 auto; padding: 0 16px 80px; }
.hidden { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--purple); outline-offset: 2px; border-radius: 6px; }

/* ---------- ribbon (uji coba) ---------- */
.ribbon { background: var(--yellow-bg); border-bottom: 2px dashed var(--yellow); color: var(--yellow-ink); text-align: center; padding: 6px 12px; font-size: .95rem; }

/* ---------- start screen ---------- */
.hero { text-align: center; padding: 36px 0 18px; }
.hero h1 { font-size: clamp(2rem, 6vw, 3rem); color: var(--teal-dark); }
.hero .sub { color: var(--purple); font-weight: 700; margin-top: 6px; }
.badges { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 16px 0; }
.badge { font-family: 'Patrick Hand', cursive; font-size: 1.05rem; padding: 4px 16px; border-radius: 999px; border: 2px dashed var(--teal); color: var(--teal-dark); background: var(--teal-bg); }
.panel { background: var(--card); border: 2px solid var(--line); border-radius: var(--radius); padding: 20px; margin: 16px 0; }
.panel.purple { background: var(--purple-bg); border-color: var(--purple); }
.panel h2 { font-size: 1.5rem; color: var(--teal-dark); margin-bottom: 8px; }
.panel ul { margin: 6px 0 0; padding-left: 1.2em; }
.panel li { margin: 4px 0; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
.form-grid .full { grid-column: 1 / -1; }
.field label { display: block; font-weight: 700; margin-bottom: 4px; }
.field input { width: 100%; padding: 10px 12px; border: 2px solid var(--line); border-radius: 10px; background: #fff; }
.field input:focus { border-color: var(--teal); }
.field .err { color: var(--coral); font-size: .9rem; min-height: 1.2em; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; cursor: pointer; background: var(--teal); color: #fff; font-weight: 700; font-size: 1.1rem; padding: 12px 26px; border-radius: 999px; }
.btn:hover { background: var(--teal-dark); }
.btn.secondary { background: #fff; color: var(--teal-dark); border: 2px solid var(--teal); }
.btn.secondary:hover { background: var(--teal-bg); }
.btn.coral { background: var(--coral); }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }

/* ---------- sticky bar ---------- */
.bar { position: sticky; top: 0; z-index: 20; background: rgba(255, 253, 248, .96); backdrop-filter: blur(6px); border-bottom: 2px solid var(--line); }
.bar-in { max-width: 860px; margin: 0 auto; padding: 8px 16px; }
.bar-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.bar .who { font-weight: 700; color: var(--teal-dark); }
.progress { flex: 1 1 160px; height: 10px; background: var(--line); border-radius: 999px; overflow: hidden; min-width: 120px; }
.progress > i { display: block; height: 100%; width: 0; background: var(--teal); transition: width .25s; }
.timer { font-variant-numeric: tabular-nums; font-weight: 700; background: var(--teal-bg); color: var(--teal-dark); border-radius: 999px; padding: 2px 12px; }
.timer.low { background: var(--coral-bg); color: var(--coral); }
.count { font-size: .95rem; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.chip { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); background: #fff; color: var(--muted); font-weight: 700; font-size: .85rem; cursor: pointer; padding: 0; }
.chip.done { background: var(--teal); border-color: var(--teal); color: #fff; }
.chip.partial { background: var(--yellow-bg); border-color: var(--yellow); color: var(--yellow-ink); }
.chip.ok { background: var(--green); border-color: var(--green); color: #fff; }
.chip.bad { background: var(--coral); border-color: var(--coral); color: #fff; }

/* ---------- text sections ---------- */
.section { margin-top: 30px; }
.banner { display: inline-block; background: var(--coral); color: #fff; font-weight: 700; padding: 4px 12px; border-radius: 6px; font-size: .95rem; }
.sec-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 12px 0 8px; }
.sec-head h2 { font-size: 1.7rem; color: var(--teal-dark); }
.genre { background: var(--purple); color: #fff; border-radius: 999px; padding: 2px 14px; font-weight: 700; font-size: .9rem; }
.passage { background: var(--yellow-bg); border: 2px solid var(--yellow); border-radius: var(--radius); padding: 16px 18px; }
.passage .para { display: flex; gap: 10px; margin: 0 0 10px; }
.passage .para:last-child { margin-bottom: 0; }
.pn { flex: none; width: 22px; height: 22px; margin-top: 4px; border-radius: 50%; background: #fde9a6; color: var(--yellow-ink); font-size: .75rem; font-weight: 700; display: grid; place-items: center; }
.passage p { margin: 0; }
.passage h3 { font-size: 1.15rem; color: var(--purple); margin: 12px 0 4px; }
.passage ul, .passage ol { margin: 4px 0 8px; padding-left: 1.4em; }
.passage li { margin: 3px 0; }
.callout { background: var(--coral-bg); border-left: 5px solid var(--coral); padding: 8px 12px; border-radius: 6px; margin-top: 10px; }
.data { margin-top: 14px; }
.data caption { text-align: left; font-weight: 700; padding-bottom: 6px; color: var(--teal-dark); }
.data table, table.grid { border-collapse: collapse; width: 100%; background: #fff; }
.data th, .data td { border: 1.5px solid var(--line); padding: 6px 10px; text-align: left; }
.data th { background: var(--teal-bg); }
.data td:last-child, .data th:last-child { text-align: center; width: 110px; }
.data .note { font-size: .85rem; color: var(--muted); margin-top: 4px; }

/* ---------- questions ---------- */
.q { background: var(--card); border: 2px solid var(--line); border-radius: var(--radius); padding: 16px 18px; margin-top: 14px; }
.q.ok { border-color: var(--green); }
.q.bad { border-color: var(--coral); }
.q-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
.q-num { width: 34px; height: 34px; border-radius: 50%; background: var(--teal); color: #fff; font-weight: 700; display: grid; place-items: center; }
.q-skill { font-size: .8rem; font-weight: 700; color: #fff; border-radius: 999px; padding: 1px 12px; }
.s-textual { background: var(--teal); } .s-inferential { background: var(--purple); }
.s-evaluation { background: var(--coral); } .s-appreciation { background: #8a5a00; }
.q-kind { font-size: .8rem; font-weight: 700; background: var(--yellow); color: #4a3300; border-radius: 999px; padding: 1px 12px; }
.q-verdict { margin-left: auto; font-weight: 700; }
.q-verdict.ok { color: var(--green); } .q-verdict.bad { color: var(--coral); }
.q-text { margin: 4px 0 10px; font-weight: 700; }
.hint { font-size: .92rem; color: var(--muted); margin: -4px 0 8px; font-style: italic; }
.opts { display: grid; gap: 6px; }
.opt { display: flex; align-items: flex-start; gap: 10px; padding: 8px 12px; border: 2px solid var(--line); border-radius: 10px; cursor: pointer; background: #fff; }
.opt:hover { border-color: var(--teal); background: var(--teal-bg); }
.opt input { margin-top: 5px; width: 18px; height: 18px; accent-color: var(--teal); flex: none; }
.opt .ltr { font-weight: 700; color: var(--purple); flex: none; width: 1.2em; }
.opt:has(input:checked) { border-color: var(--teal); background: var(--teal-bg); }
.opt.right { border-color: var(--green); background: var(--green-bg); }
.opt.wrong { border-color: var(--coral); background: var(--coral-bg); }
.opt.missed { border-style: dashed; border-color: var(--green); }
.opt .tag { margin-left: auto; font-size: .8rem; font-weight: 700; white-space: nowrap; }
.opt.right .tag { color: var(--green); } .opt.wrong .tag { color: var(--coral); } .opt.missed .tag { color: var(--green); }
.gwrap { overflow-x: auto; }
table.grid th { background: var(--teal); color: #fff; padding: 6px 10px; text-align: center; }
table.grid th:first-child { text-align: left; }
table.grid td { border-bottom: 1.5px dashed var(--line); padding: 8px 10px; }
table.grid td.c { text-align: center; width: 92px; }
table.grid input { width: 18px; height: 18px; accent-color: var(--teal); }
table.grid tr.right td:first-child { border-left: 5px solid var(--green); }
table.grid tr.wrong td:first-child { border-left: 5px solid var(--coral); }
table.grid td.key { background: var(--green-bg); }
.orow { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1.5px dashed var(--line); }
.orow select { flex: none; width: 76px; padding: 6px; border: 2px solid var(--line); border-radius: 8px; background: #fff; }
.orow.right { border-left: 5px solid var(--green); padding-left: 8px; }
.orow.wrong { border-left: 5px solid var(--coral); padding-left: 8px; }
.orow .tag { margin-left: auto; font-size: .85rem; font-weight: 700; color: var(--green); white-space: nowrap; }
.why { margin-top: 12px; padding: 10px 14px; background: var(--purple-bg); border-left: 5px solid var(--purple); border-radius: 8px; }
.why b { color: var(--purple); }
.dupe { color: var(--coral); font-size: .9rem; min-height: 1.1em; }

/* ---------- submit ---------- */
.submit-box { text-align: center; margin: 36px 0 10px; padding: 22px; background: var(--teal-bg); border: 2px dashed var(--teal); border-radius: var(--radius); }
.submit-box p { margin: 0 0 12px; }

/* ---------- result ---------- */
.result { background: #fff; border: 3px solid var(--teal); border-radius: 20px; padding: 22px; margin-top: 22px; }
.score-row { display: flex; flex-wrap: wrap; gap: 22px; align-items: center; }
.ring { --p: 0; width: 150px; height: 150px; border-radius: 50%; background: conic-gradient(var(--teal) calc(var(--p) * 1%), var(--line) 0); display: grid; place-items: center; flex: none; }
.ring > div { width: 118px; height: 118px; border-radius: 50%; background: #fff; display: grid; place-items: center; text-align: center; line-height: 1.1; }
.ring b { font-family: 'Patrick Hand', cursive; font-weight: 400; font-size: 2.4rem; color: var(--teal-dark); display: block; }
.ring span { font-size: .85rem; color: var(--muted); }
.res-msg h2 { font-size: 1.8rem; color: var(--teal-dark); }
.res-msg p { margin: 4px 0; }
.bars { display: grid; gap: 8px; margin-top: 14px; }
.bars h3 { font-size: 1.25rem; color: var(--purple); margin-top: 8px; }
.bar-line { display: grid; grid-template-columns: 170px 1fr 52px; gap: 10px; align-items: center; font-size: .95rem; }
.bar-line .track { height: 12px; background: var(--line); border-radius: 999px; overflow: hidden; }
.bar-line .track i { display: block; height: 100%; background: var(--teal); }
.bar-line .val { text-align: right; font-weight: 700; }
.status { margin-top: 14px; padding: 10px 14px; border-radius: 10px; font-weight: 700; }
.status.ok { background: var(--green-bg); color: var(--green); }
.status.sending, .status.test, .status.unsure { background: var(--yellow-bg); color: var(--yellow-ink); }
.status.fail { background: var(--coral-bg); color: var(--coral); }
.filter { display: flex; gap: 8px; margin: 18px 0 0; flex-wrap: wrap; align-items: center; }
.filter label { cursor: pointer; border: 2px solid var(--teal); border-radius: 999px; padding: 3px 14px; font-weight: 700; color: var(--teal-dark); background: #fff; }
.filter label:has(input:checked) { background: var(--teal); color: #fff; }
.filter input { position: absolute; opacity: 0; }

/* ---------- modal ---------- */
.modal-back { position: fixed; inset: 0; background: rgba(20, 20, 30, .55); z-index: 50; display: grid; place-items: center; padding: 16px; }
.modal { background: #fff; border-radius: 18px; padding: 22px; max-width: 460px; width: 100%; }
.modal h2 { font-size: 1.6rem; color: var(--teal-dark); margin-bottom: 6px; }

footer.note { text-align: center; color: var(--muted); font-size: .85rem; margin-top: 40px; }

@media (max-width: 640px) {
  body { font-size: 1rem; }
  .form-grid { grid-template-columns: 1fr; }
  .bar-line { grid-template-columns: 1fr 1fr 48px; }
  .bar-line span:first-child { grid-column: 1 / -1; }
  .chip { width: 28px; height: 28px; }
  .q { padding: 14px; }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .progress > i { transition: none; } }
@media print {
  .bar, .submit-box, .filter, .actions, .ribbon { display: none !important; }
  body { background: #fff; }
  .q, .passage { break-inside: avoid; }
}
.passage .src { font-size: .85rem; color: var(--muted); font-style: italic; margin-top: 10px; }

/* ---------- pengaman ujian ---------- */
body.locked .passage, body.locked .q, body.locked .sec-head, body.locked .banner { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
body.away #app { filter: blur(16px); pointer-events: none; }
body.away::after { content: 'Kembali ke halaman ujian untuk melanjutkan…'; position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; font-family: 'Patrick Hand', cursive; font-size: 1.6rem; color: var(--teal-dark); z-index: 50; }
.strikes { font-weight: 700; background: var(--coral-bg); color: var(--coral); border-radius: 999px; padding: 2px 10px; }
.rules ul { margin: 6px 0 0; padding-left: 1.3em; }
.rules li { margin: 5px 0; }
label.agree { display: flex; gap: 10px; align-items: flex-start; font-weight: 700; cursor: pointer; }
label.agree input { width: 20px; height: 20px; margin-top: 3px; accent-color: var(--teal); flex: none; }
.numpick { display: inline-flex; gap: 4px; flex: none; }
.numpick label { position: relative; cursor: pointer; }
.numpick input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.numpick span { display: grid; place-items: center; width: 34px; height: 34px; border: 2px solid var(--line); border-radius: 8px; background: #fff; font-weight: 700; }
.numpick input:checked + span { background: var(--teal); border-color: var(--teal); color: #fff; }
.numpick input:focus-visible + span { outline: 3px solid var(--purple); outline-offset: 2px; }
.numpick input:disabled { cursor: default; }
.integrity { font-size: .92rem; color: var(--coral); }
@media print { body.locked #app { display: none !important; } body.locked::before { content: 'Pencetakan dinonaktifkan selama ujian.'; } }

<script>window.TKA_DATA = {"meta":{"title":"TKA English Simulation Pack","subtitle":"6 Texts · 30 Questions · Level B1–B2","version":"2026-10-v1"},"skills":["Textual","Inferential","Evaluation & Appreciation"],"texts":[{"id":1,"genre":"Hortatory Exposition","title":"Let's Cycle to School!","source":"Original text written for this simulation.","blocks":[{"t":"p","x":"Every morning, the streets around our school are packed with motorbikes and cars. Many students are dropped off at the gate even though they live less than three kilometres away. I believe that more students should cycle to school, and our school should support this habit."},{"t":"p","x":"First, cycling is good for our health. Teenagers need at least an hour of physical activity every day, but most of us spend our days sitting in class or looking at screens. A fifteen-minute ride in the morning wakes up the body and can help us concentrate better during the first lesson."},{"t":"p","x":"Second, cycling is good for the environment and for our families' wallets. A bicycle produces no exhaust fumes, so every student who cycles helps to reduce traffic jams and air pollution near the school. Parents also save money on fuel, especially when they make two or three trips a day."},{"t":"p","x":"Some parents worry that cycling is dangerous. That is a fair concern. However, the real problem is not the bicycle itself, but the lack of safe lanes and secure parking."},{"t":"p","x":"Therefore, I urge our school to build a secure bicycle parking area, and I encourage the local government to paint a bike lane on the main road. Students, why not try cycling just twice a week? Let's make our school gate a place where fresh air, not exhaust, greets us every morning."}],"range":[1,5]},{"id":2,"genre":"Analytical Exposition","title":"Why Local Languages Deserve a Place in Our Classrooms","source":"Original text written for this simulation.","blocks":[{"t":"p","x":"Indonesia has more than 700 living languages, yet many of them are spoken by fewer and fewer young people. In my opinion, local languages should be taught in schools as a regular subject because they carry knowledge, build confidence, and even support learning."},{"t":"p","x":"First, a local language carries a community's knowledge. Traditional farming methods, herbal medicine, and folk stories are often passed down in the language of the region. When a language disappears, this knowledge may disappear with it."},{"t":"p","x":"Second, students who are proud of their home language tend to feel more confident at school. Education experts, including those at UNESCO, have pointed out that children understand new ideas more easily when they are explained in a language they already speak. Confidence and understanding, in turn, lead to better results."},{"t":"p","x":"Third, knowing more than one language trains the brain. Students who switch between languages every day may become better at solving problems and at learning foreign languages, including English."},{"t":"p","x":"In conclusion, teaching local languages is not a step backward. By giving these languages a place in the timetable, schools protect cultural heritage while helping students succeed."}],"range":[6,10]},{"id":3,"genre":"Recount Text (Biography)","title":"Ki Hajar Dewantara: The Father of Indonesian Education","source":"Biography. Dates and events checked against published sources.","blocks":[{"t":"p","x":"Ki Hajar Dewantara was born as Raden Mas Soewardi Soerjaningrat on 2 May 1889 in Yogyakarta. He came from a noble family, so he could attend a Dutch school, which was rare for most Indonesians at that time. Later, he entered a medical school in Batavia, but he had to leave because of poor health."},{"t":"p","x":"After that, he became a journalist. His sharp articles criticised Dutch colonial rule. In 1913, he wrote a famous article asking why Indonesians had to pay for a celebration of the Netherlands' freedom while they themselves were not free. As a result, the colonial government sent him into exile in the Netherlands."},{"t":"p","x":"In the Netherlands, he studied education and became convinced that schools should be open to everyone. When he returned home in 1919, he put his ideas into action. In 1922, he founded Taman Siswa, a school that welcomed children from ordinary families. He also dropped his noble title and took the name Ki Hajar Dewantara to be closer to the people."},{"t":"p","x":"After independence, he became Indonesia's first Minister of Education in 1945. He died on 26 April 1959, and his birthday is now celebrated as National Education Day. His motto, “Tut wuri handayani”, meaning “from behind, he gives encouragement”, is still used in Indonesian schools today."}],"range":[11,15]},{"id":4,"genre":"Recount Text (Personal Experience)","title":"My First Beach Clean-up","source":"Original text written for this simulation.","blocks":[{"t":"p","x":"Last Saturday, my friends and I joined a beach clean-up organised by a youth community in our town. I was a little nervous because I had never done any volunteer work before."},{"t":"p","x":"We met at the beach at seven in the morning. A coordinator named Kak Dimas handed out gloves, sacks, and a small notebook for recording the types of rubbish we found. First, he explained the safety rules: always wear gloves and never touch broken glass. Then he divided us into groups of five."},{"t":"p","x":"For two hours, my group walked along the shore and collected rubbish. At first, it felt like a boring task, but it soon became a friendly competition between groups. By nine o'clock, we had filled twelve sacks. To my surprise, plastic bottles and bags were everywhere, and there were hundreds of cigarette butts hidden in the sand."},{"t":"p","x":"After that, we gathered under a tree to sort and count what we had collected. Kak Dimas said the notebooks would be sent to the local government as evidence of the problem. I felt proud that something as simple as writing in a notebook could matter."},{"t":"p","x":"Finally, we shared a simple lunch of rice and fried tempeh. I went home exhausted, but I also felt happy. Before this experience, I thought one person could not change much. Now I know that many small efforts together can make a visible difference. I am already planning to join the next clean-up."}],"range":[16,20]},{"id":5,"genre":"Narrative Text","title":"Kancil and the Crocodiles","source":"Indonesian folktale, retold for this simulation.","blocks":[{"t":"p","x":"Long ago, in a thick forest beside a wide river, there lived a clever little mousedeer named Kancil. One hot afternoon, he saw a tree full of ripe mangoes on the other side of the river. His stomach growled, but the river was deep and full of hungry crocodiles."},{"t":"p","x":"Kancil thought hard. Then he walked to the riverbank and shouted, “Crocodiles! The King of the Forest has asked me to count all of you for a grand feast. Line up from this bank to the other so that I can count you!”"},{"t":"p","x":"The crocodiles were greedy. They imagined a delicious feast and quickly lined up across the river, one behind another. Kancil jumped onto the first crocodile's back. “One,” he said. He hopped to the next. “Two.” Counting loudly, he leapt from back to back until he reached the other side."},{"t":"p","x":"“Thank you, my friends!” Kancil laughed as he landed on dry ground. “There is no feast. I only wanted to cross the river to get the mangoes!” The crocodiles were furious, but there was nothing they could do."},{"t":"p","x":"Kancil ate mangoes until he was full. Yet he did not feel entirely proud. As he looked back at the river, he wondered whether it was right to fool others, even greedy ones. From that day on, he tried to solve his problems with wisdom that did not harm anyone."}],"range":[21,25]},{"id":6,"genre":"Procedure Text","title":"How to Make a Simple Compost Bin","source":"Original text written for this simulation.","blocks":[{"t":"u","x":"Food scraps do not have to end up in the rubbish bin. With a simple bucket, you can turn them into rich soil for your plants."},{"t":"h","x":"Materials"},{"t":"ul","items":["a plastic bucket with a lid (about 20 litres)","a drill (ask an adult for help)","dry leaves or shredded paper (“brown” materials)","fruit and vegetable scraps (“green” materials)","a little garden soil","a small shovel"]},{"t":"h","x":"Steps"},{"t":"ol","items":["Make about ten small holes in the sides and the bottom of the bucket so that air can enter and extra water can escape.","Put a layer of dry leaves or shredded paper at the bottom.","Add a layer of fruit and vegetable scraps and cover it with a thin layer of garden soil.","Repeat the layers until the bucket is three-quarters full. Always finish with a layer of dry leaves.","Sprinkle a little water until the contents feel like a squeezed sponge: moist, but not dripping.","Close the lid and keep the bucket in a shady place. Stir the contents with the shovel once a week.","After two to three months, the compost will look dark and smell like fresh earth. Now it is ready to use."]},{"t":"u","x":"Tip: Do not add meat, fish, or oily food because they smell bad and attract pests."}],"range":[26,30]}],"items":[{"no":1,"text":1,"skill":"Textual","cls":"textual","type":"mcx","q":"Which reasons for cycling to school are mentioned in the text?","options":["It helps students make new friends.","It keeps the body active and helps students concentrate.","It reduces traffic jams and air pollution.","It makes students arrive faster than motorbike riders.","It saves families money on fuel."]},{"no":2,"text":1,"skill":"Textual","cls":"textual","type":"mc","q":"The phrase “a fair concern” (paragraph 4) is closest in meaning to ...","options":["an unreasonable fear","an expensive problem","a secret plan","a reasonable worry","a rude question"]},{"no":3,"text":1,"skill":"Inferential","cls":"inferential","type":"mc","q":"What can be inferred about the writer's attitude toward parents who worry about safety?","options":["The writer thinks the parents are exaggerating a small problem.","The writer understands their worry but believes it can be solved.","The writer believes cycling should be forbidden near the school gate.","The writer refuses to discuss the issue with the parents.","The writer is angry because the parents ignore the bicycle."]},{"no":4,"text":1,"skill":"Evaluation & Appreciation","cls":"evaluation","type":"grid","q":"Decide whether each statement from the text is a Fact or an Opinion.","cols":["Fact","Opinion"],"rows":["A bicycle produces no exhaust fumes.","Our school should build a secure bicycle parking area.","Many students live less than three kilometres from school.","Students should try cycling just twice a week."],"kind":"Fact or Opinion"},{"no":5,"text":1,"skill":"Evaluation & Appreciation","cls":"evaluation","type":"mc","q":"Which additional information would best strengthen the writer's argument that cycling is good for students' health?","options":["A photograph of the crowded school gate during the morning rush.","A story about a famous racing cyclist who won a big international race.","A list of the most expensive bicycle brands sold in the country.","A map showing where all the bicycle shops in town are located.","A school survey showing that cyclists are fitter and more focused."]},{"no":6,"text":2,"skill":"Textual","cls":"textual","type":"order","q":"Number the writer's arguments from 1 to 3 in the order they appear in the text.","rows":["Knowing more than one language trains the brain.","A local language carries a community's knowledge.","Pride in the home language builds confidence and understanding."]},{"no":7,"text":2,"skill":"Textual","cls":"textual","type":"mc","q":"The word “heritage” in paragraph 5 is closest in meaning to ...","options":["culture and traditions passed down from the past","a modern machine used in many classrooms","a timetable of lessons for the whole week","a foreign language that students learn at school","an expensive old building in a big city"]},{"no":8,"text":2,"skill":"Inferential","cls":"inferential","type":"mc","q":"What can be inferred from the sentence “When a language disappears, this knowledge may disappear with it”?","options":["Traditional knowledge can only be preserved in printed books.","The loss of a language has no effect on a community's life.","A community's knowledge is often kept alive through its language.","Traditional farming methods are no longer useful in modern life today.","Folk stories are not important enough to be remembered."]},{"no":9,"text":2,"skill":"Evaluation & Appreciation","cls":"evaluation","type":"mcx","q":"Which additions would make the writer's argument stronger?","options":["A study comparing the test scores of students taught in different languages.","A detailed description of the writer's favourite regional dish.","A long list of famous singers who sing mainly in English.","An interview with a teacher who uses a local language in class.","A photograph of the writer's school taken from the main road."]},{"no":10,"text":2,"skill":"Textual","cls":"textual","type":"grid","q":"Decide whether each statement is True or False according to the text.","cols":["True","False"],"rows":["The writer says that local languages are spoken by more and more young people.","The writer mentions UNESCO to support the idea about understanding new ideas.","The writer says that teaching local languages is a step backward.","The writer suggests that students who know several languages may learn foreign languages more easily."],"kind":"True or False"},{"no":11,"text":3,"skill":"Textual","cls":"textual","type":"order","q":"Number the events from 1 to 4 in the order they happened in Ki Hajar Dewantara's life.","rows":["He became the first Minister of Education.","He was sent into exile in the Netherlands.","He left medical school because of poor health.","He founded Taman Siswa."]},{"no":12,"text":3,"skill":"Textual","cls":"textual","type":"mc","q":"Why did the colonial government send him into exile?","options":["He failed his medical examinations.","He criticised Dutch rule in a published article.","He refused to attend a Dutch school.","He opened a school without official permission.","He asked to continue his studies in the Netherlands."]},{"no":13,"text":3,"skill":"Inferential","cls":"inferential","type":"mc","q":"What does his decision to drop his noble title suggest about his character?","options":["He was ashamed of his family background.","He wanted to leave Indonesia permanently.","He hoped to become wealthy through teaching.","He disliked working with ordinary people.","He valued equality more than social status."]},{"no":14,"text":3,"skill":"Evaluation & Appreciation","cls":"evaluation","type":"mcx","q":"Which values are shown in Ki Hajar Dewantara's life story?","options":["A strong fear of public criticism","Loyalty to the Dutch colonial government","Courage in speaking against injustice","Interest in earning money from education","A belief that education should be for everyone"]},{"no":15,"text":3,"skill":"Evaluation & Appreciation","cls":"evaluation","type":"mc","q":"Which statement best describes the language features of the text?","options":["Imperative sentences and sequence words such as “first”, “next” and “finally”","Present tense and technical terms that describe general facts","Modal verbs that express strong recommendations to readers","Simple past tense and time expressions that arrange events in order","Direct speech with many exclamation marks and questions"]},{"no":16,"text":4,"skill":"Textual","cls":"textual","type":"mc","q":"Which sequence best reflects the events in the text?","options":["Safety rules → groups formed → collecting rubbish → sorting and counting → lunch","Collecting rubbish → safety rules → lunch → sorting and counting → groups formed","Groups formed → lunch → safety rules → collecting rubbish → sorting and counting","Safety rules → collecting rubbish → lunch → sorting and counting → groups formed","Lunch → safety rules → groups formed → collecting rubbish → sorting and counting"]},{"no":17,"text":4,"skill":"Inferential","cls":"inferential","type":"mc","q":"“At first, it felt like a boring task, but it soon became a friendly competition between groups.” What does this sentence suggest?","options":["The writer never enjoyed the activity.","The coordinator forced the groups to compete.","The competition made the work more enjoyable.","The groups refused to work with each other.","The task became easier because of special tools."]},{"no":18,"text":4,"skill":"Textual","cls":"textual","type":"grid","q":"Decide whether each statement is True or False according to the text.","cols":["True","False"],"rows":["The clean-up started at seven in the morning.","Each group had ten volunteers.","The writer had joined many volunteer activities before.","The volunteers found hundreds of cigarette butts."],"kind":"True or False"},{"no":19,"text":4,"skill":"Evaluation & Appreciation","cls":"evaluation","type":"mc","q":"Which message does the writer most likely want to share with readers?","options":["Cleaning the environment should be left to professionals.","Beaches are too dangerous for young volunteers to visit.","Competition is the best way to learn new skills.","Small actions by many people can make a real difference.","Volunteers should always be paid for their work."]},{"no":20,"text":4,"skill":"Evaluation & Appreciation","cls":"evaluation","type":"mcx","q":"Which sentences show the writer's feelings about the experience?","options":["“I was a little nervous because I had never done any volunteer work before.”","“We met at the beach at seven in the morning.”","“I felt proud that something as simple as writing in a notebook could matter.”","“Kak Dimas said the notebooks would be sent to the local government as evidence of the problem.”","“I went home exhausted, but I also felt happy.”"]},{"no":21,"text":5,"skill":"Textual","cls":"textual","type":"mc","q":"What problem did Kancil face at the beginning of the story?","options":["He had lost his way while looking for food deep in the forest.","He could not cross the crocodile-filled river to reach the mangoes.","Hunters were chasing him through the forest all afternoon long.","He had no friends who were willing to share their food with him.","The mango tree was too tall and too thin for him to climb up."]},{"no":22,"text":5,"skill":"Inferential","cls":"inferential","type":"mc","q":"Why did the crocodiles agree to line up across the river?","options":["They wanted to help Kancil reach the mangoes on the other side.","They wanted to play a counting game with Kancil.","They were too tired to argue with such a clever animal.","They were afraid that Kancil would hurt them if they refused.","They believed the promise of a feast because they were greedy."]},{"no":23,"text":5,"skill":"Inferential","cls":"inferential","type":"mc","q":"Kancil's plan for crossing the river shows that he is ...","options":["clever and resourceful","honest, gentle and very shy","lazy, careless and forgetful","brave, but rather foolish","kind and generous to others"]},{"no":24,"text":5,"skill":"Evaluation & Appreciation","cls":"evaluation","type":"mcx","q":"Which statements are fair evaluations of Kancil's actions?","options":["He was honest because he told the crocodiles his real plan.","He solved a difficult problem with creativity.","He was cruel because he injured the crocodiles.","He was dishonest because he lied about the feast.","He was brave because he fought the crocodiles."]},{"no":25,"text":5,"skill":"Inferential","cls":"inferential","type":"mc","q":"What does the last paragraph reveal about Kancil?","options":["He planned to trick the crocodiles again the next day.","He regretted eating so many mangoes that afternoon.","He began to think about the effects of his actions.","He decided to leave the forest and never come back.","He was still angry with the crocodiles for scaring him."]},{"no":26,"text":6,"skill":"Textual","cls":"textual","type":"mc","q":"Why does the writer tell readers to make holes in the bucket?","options":["To make the bucket lighter","To let insects enter the bucket","To pour in the soil more easily","To let air in and extra water out","To show that the bucket has been used"]},{"no":27,"text":6,"skill":"Textual","cls":"textual","type":"grid","q":"According to the text, classify each material as a “brown” or a “green” material.","cols":["Brown material","Green material"],"rows":["Dry leaves","Fruit scraps","Shredded paper","Vegetable scraps"],"kind":"Classification"},{"no":28,"text":6,"skill":"Inferential","cls":"inferential","type":"mc","q":"A student's compost looks watery and smells bad. Which action is most likely to solve the problem?","options":["Add more fruit scraps to the bucket and close the lid.","Add dry leaves or shredded paper and stir the contents.","Add some fish scraps because they contain extra nutrients.","Pour more water into the bucket to wash the smell away.","Close the lid tightly and leave the bucket alone for a month."]},{"no":29,"text":6,"skill":"Evaluation & Appreciation","cls":"evaluation","type":"mcx","q":"Which statements about the text are correct?","options":["It tells the writer's personal experience in the past.","It explains how to do something step by step.","It argues that composting should be compulsory for everyone.","It includes a list of the materials needed.","It uses commands such as “Add a layer of fruit and vegetable scraps”."]},{"no":30,"text":6,"skill":"Evaluation & Appreciation","cls":"evaluation","type":"mc","q":"What is the purpose of the tip at the end of the text?","options":["To advertise a compost product that is sold in shops","To describe the writer's feelings about gardening at home","To persuade readers to buy a bigger and better bucket","To summarise all the steps in the procedure for readers","To help readers avoid mistakes that spoil the compost"]}]};</script>

<script>
(function () {
  'use strict';

  var CFG = window.TKA_CONFIG;
  var DATA = window.TKA_DATA;
  var STORE = 'tka-b1b2-progress-v1';
  var app = document.getElementById('app');
  var ribbon = document.getElementById('ribbon');
  var LETTERS = 'ABCDE';
  var KEY = null;
  var GAS = !!(window.google && window.google.script && window.google.script.run);
  function canSend() { return GAS || !!CFG.ENDPOINT; }
  var LOCK = CFG.LOCK !== false;
  var MAXL = CFG.MAX_LEAVES == null ? 3 : Number(CFG.MAX_LEAVES);
  var INIT_LANG = document.documentElement.getAttribute('lang');
  var timerId = null;
  var state = freshState();

  function freshState() {
    return { student: null, answers: {}, startedAt: null, attemptId: null, submitted: false, result: null, auto: false, autoWhy: '', filter: 'all', payload: null, leaves: 0, leaveSecs: 0, trans: 0, log: [], lastSeen: 0 };
  }

  // ------------------------------------------------------------------ util
  function el(tag, props) {
    var e = document.createElement(tag);
    if (props) {
      Object.keys(props).forEach(function (k) {
        var v = props[k];
        if (v === false || v == null) return;
        if (k === 'class') e.className = v;
        else if (k.slice(0, 2) === 'on' && typeof v === 'function') e.addEventListener(k.slice(2), v);
        else if (v === true) e.setAttribute(k, '');
        else e.setAttribute(k, String(v));
      });
    }
    for (var i = 2; i < arguments.length; i++) append(e, arguments[i]);
    return e;
  }
  function append(parent, c) {
    if (c == null || c === false) return;
    if (Array.isArray(c)) { c.forEach(function (x) { append(parent, x); }); return; }
    parent.appendChild(c.nodeType ? c : document.createTextNode(String(c)));
  }
  function safeGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function safeSet(k, v) { try { window.localStorage.setItem(k, v); } catch (e) { /* abaikan */ } }
  function safeDel(k) { try { window.localStorage.removeItem(k); } catch (e) { /* abaikan */ } }
  function getKey() {
    if (!KEY) {
      var bin = atob(window.TKA_KEY);
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      KEY = JSON.parse(new TextDecoder('utf-8').decode(bytes));
    }
    return KEY;
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function pad(n) { return n < 10 ? '0' + n : String(n); }
  function fmtTime(sec) { sec = Math.max(0, Math.round(sec)); return pad(Math.floor(sec / 60)) + ':' + pad(sec % 60); }
  function itemsOf(textId) { return DATA.items.filter(function (i) { return i.text === textId; }); }
  function clearApp() { while (app.firstChild) app.removeChild(app.firstChild); }

  // ------------------------------------------------------------- penilaian
  function isCorrect(item, ans, k) {
    if (ans == null) return false;
    if (item.type === 'mc') return ans === k;
    if (!Array.isArray(ans)) return false;
    if (item.type === 'mcx') {
      return ans.length === k.length && k.every(function (x) { return ans.indexOf(x) !== -1; });
    }
    return ans.length === k.length && k.every(function (x, i) { return ans[i] === x; });
  }
  function answerState(item) {
    var a = state.answers[item.no];
    if (item.type === 'mc') return a == null ? 'none' : 'done';
    if (item.type === 'mcx') return a && a.length ? 'done' : 'none';
    if (!a) return 'none';
    var filled = a.filter(function (x) { return x != null; });
    if (!filled.length) return 'none';
    if (filled.length < item.rows.length) return 'partial';
    if (item.type === 'order' && new Set(filled).size !== filled.length) return 'partial';
    return 'done';
  }
  function grade() {
    var key = getKey();
    var per = [];
    var score = 0;
    DATA.items.forEach(function (it, idx) {
      var ok = isCorrect(it, state.answers[it.no], key[idx].a);
      per.push(ok ? 1 : 0);
      if (ok) score++;
    });
    var bySkill = DATA.skills.map(function (s) {
      var its = DATA.items.filter(function (i) { return i.skill === s; });
      return { name: s, ok: its.filter(function (i) { return per[i.no - 1]; }).length, total: its.length };

  function qCard(item, mode) {

    if (item.type === 'grid') card.append(gridBody(item, review, key, ans));
    if (item.type === 'order') card.append(el('p', { class: 'hint' }, 'Write the numbers 1 to ' + item.rows.length + ' (each number is used once).'), orderBody(item, review, key, ans));

    if (review) {
      card.append(el('div', { class: 'why' }, el('b', null, 'Pembahasan: '), getKey()[item.no - 1].w));
    }
    return card;
  }

  function mcBody(item, review, key, ans) {

    });

  }

  function gridBody(item, review, key, ans) {

  // ------------------------------------------------- integritas ujian
  // Catatan: peramban tidak mengizinkan halaman web MENCEGAH pindah tab atau terjemahan.
  // Yang dilakukan di sini: mendeteksi, memperingatkan, mencatat, dan (opsional) mengumpulkan otomatis.

    var h = document.documentElement;

    if (INIT_LANG !== null && h.getAttribute('lang') !== INIT_LANG) return true;
    if (document.querySelector('font, .skiptranslate, #goog-gt-tt, iframe.goog-te-banner-frame')) return true;
    var t = document.querySelector('.hero h1');

  }

      var y = window.scrollY;
      guard.rendering = true;
      document.documentElement.className = (document.documentElement.className || '').replace(/\btranslated-\w+\b/g, '').trim();
      if (INIT_LANG !== null) document.documentElement.setAttribute('lang', INIT_LANG);
      renderQuiz();
      updateStrikes();

      window.scrollTo(0, y);
      guard.rendering = false;

    }
  }
  function awayCandidate() {

  function leave(kind) {

  }
  function back() {
    if (!guard.away || awayCandidate()) return;

  }

    if (e.key === 'F12' || (mod && e.shiftKey && 'ijc'.indexOf(k) !== -1) || (mod && 'cxaups'.indexOf(k) !== -1 && k.length === 1)) e.preventDefault();
  }
  function startGuard() {

    on(document, 'contextmenu', block);
    on(document, 'copy', block); on(document, 'cut', block); on(document, 'dragstart', block); on(document, 'selectstart', block);

      guard.mo.observe(document.documentElement, { attributes: true, attributeFilter: ['class', 'lang', 'translate'], childList: true, subtree: true, characterData: true });
    } catch (e) { /* peramban lama */ }

      else if (guard.away) back();

  }
  function stopGuard() {
    guard.on = false;
    guard.handlers.forEach(function (h) { h[0].removeEventListener(h[1], h[2], h[3]); });
    guard.handlers = [];
    if (guard.mo) { guard.mo.disconnect(); guard.mo = null; }
    if (guard.poll) { clearInterval(guard.poll); guard.poll = null; }
    clearTimeout(guard.timer);
    guard.away = null;
    document.body.classList.remove('locked', 'away');
  }

  function updateStrikes() {
    var b = document.getElementById('strikes');
    if (!b) return;
    var n = state.leaves + state.trans;
    b.classList.toggle('hidden', n === 0);
    b.textContent = '⚠ ' + n + (MAXL > 0 ? '/' + MAXL : '');
  }
  function strike(kind, secs) {
    if (state.submitted) return;
    if (kind === 'translate') state.trans++; else { state.leaves++; state.leaveSecs += secs || 0; }
    state.log.push({ t: Math.round((Date.now() - state.startedAt) / 1000), k: kind, s: secs || 0 });
    if (state.log.length > 30) state.log.shift();
    persist();
    updateStrikes();
    var n = state.leaves + state.trans;
    if (MAXL > 0 && n >= MAXL) { state.auto = true; state.autoWhy = 'strikes'; submit(); return; }
    showWarning(kind, secs, n);
  }
  function showWarning(kind, secs, n) {
    var old = document.getElementById('warn-modal');
    if (old && old.parentNode) old.parentNode.removeChild(old);
    var what = kind === 'translate'
      ? 'Terjemahan otomatis terdeteksi. Teks sudah dikembalikan ke aslinya. Matikan terjemahan peramban.'
      : kind === 'reload'
        ? 'Halaman ujian sempat ditutup atau dimuat ulang.'
        : 'Kamu meninggalkan halaman ujian selama ' + secs + ' detik.';
    var left = MAXL > 0 ? 'Pelanggaran ' + n + ' dari ' + MAXL + '. Pelanggaran ke-' + MAXL + ' membuat jawabanmu dikumpulkan otomatis.' : 'Pelanggaran dicatat dan dilaporkan kepada gurumu.';
    var ok = el('button', { class: 'btn coral', type: 'button', id: 'warn-ok', onclick: function () { var m = document.getElementById('warn-modal'); if (m && m.parentNode) m.parentNode.removeChild(m); } }, 'Saya mengerti, lanjutkan');
    var back = el('div', { class: 'modal-back', id: 'warn-modal', role: 'alertdialog', 'aria-modal': 'true', 'aria-labelledby': 'warn-title' },
      el('div', { class: 'modal' }, el('h2', { id: 'warn-title' }, '⚠ Peringatan'), el('p', null, what), el('p', null, el('b', null, left)), el('div', { class: 'actions' }, ok)));
    document.body.appendChild(back);
    ok.focus();
  }

  // -------------------------------------------------------------- kirim
  function askSubmit() {
    var missing = DATA.items.filter(function (it) { return answerState(it) !== 'done'; }).map(function (it) { return it.no; });
    var back = el('div', { class: 'modal-back', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'm-title' });
    function close() { if (back.parentNode) back.parentNode.removeChild(back); document.removeEventListener('keydown', onKey); }
    function onKey(e) { if (e.key === 'Escape') close(); }
    var cancel = el('button', { class: 'btn secondary', type: 'button', onclick: close }, 'Kembali');
    var go = el('button', { class: 'btn coral', type: 'button', onclick: function () { close(); submit(); } }, 'Kirim sekarang');
    back.append(el('div', { class: 'modal' },
      el('h2', { id: 'm-title' }, missing.length ? 'Masih ada soal yang belum lengkap' : 'Kirim jawaban?'),
      el('p', null, missing.length
        ? 'Soal belum dijawab/lengkap: ' + missing.join(', ') + '. Soal yang kosong dinilai salah.'
        : 'Semua soal sudah dijawab. Setelah dikirim, jawaban tidak bisa diubah.'),
      el('div', { class: 'actions' }, cancel, go)));
    document.addEventListener('keydown', onKey);
    document.body.appendChild(back);
    (missing.length ? cancel : go).focus();
  }

  function submit() {
    if (state.submitted) return;
    state.submitted = true;
    stopGuard();
    if (timerId) { clearInterval(timerId); timerId = null; }
    var res = grade();
    state.result = res;
    var dur = Math.min(Math.round((Date.now() - state.startedAt) / 1000), CFG.DURATION_MIN > 0 ? CFG.DURATION_MIN * 60 : 86400);
    state.payload = {
      token: CFG.TOKEN || '',
      attemptId: state.attemptId,
      nama: state.student.nama, kelas: state.student.kelas, absen: state.student.absen,
      answers: DATA.items.map(function (it) { var a = state.answers[it.no]; return a === undefined ? null : a; }),
      clientScore: res.score,
      durationSec: dur,
      version: DATA.meta.version,
      submittedAt: new Date().toISOString(),
      auto: state.auto,
      autoWhy: state.autoWhy || (state.auto ? 'time' : ''),
      leaves: state.leaves, leaveSecs: state.leaveSecs, trans: state.trans, log: state.log
    };
    safeDel(STORE);
    renderResult();
    sendResult();
  }

  function setStatus(kind, text, retry) {
    var s = document.getElementById('status');
    if (!s) return;
    s.className = 'status ' + kind;
    while (s.firstChild) s.removeChild(s.firstChild);
    s.append(text);
    if (retry) s.append(' ', el('button', { class: 'btn secondary', type: 'button', style: 'padding:2px 14px;font-size:.95rem', onclick: sendResult }, 'Kirim ulang'));
  }

  function postJson(extra) {
    var opts = { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(state.payload) };
    if (extra) Object.keys(extra).forEach(function (k) { opts[k] = extra[k]; });
    return fetch(CFG.ENDPOINT, opts);
  }

  function sendViaGas() {
    setStatus('sending', 'Mengirim nilai ke gurumu…');
    window.google.script.run
      .withSuccessHandler(function (j) {
        if (j && j.ok) setStatus('ok', '✔ Nilai sudah tercatat di gurumu.' + (j.duplicate ? ' (sudah pernah tercatat)' : ''));
        else setStatus('fail', 'Nilai belum tercatat: ' + ((j && j.error) || 'respons tidak dikenal') + '. Tunjukkan layar ini kepada gurumu.', true);
      })
      .withFailureHandler(function (e) {
        setStatus('fail', 'Gagal mengirim (' + (e && e.message ? e.message : 'periksa koneksi') + '). Tunjukkan layar ini kepada gurumu dan coba lagi.', true);
      })
      .receiveResult(JSON.stringify(state.payload));
  }

  function sendResult() {
    if (GAS) { sendViaGas(); return; }
    if (!CFG.ENDPOINT) { setStatus('test', 'Mode uji coba: nilai ini tidak dikirim ke Google Sheet.'); return; }
    setStatus('sending', 'Mengirim nilai ke gurumu…');
    postJson().then(function (r) { return r.json(); }).then(function (j) {
      if (j && j.ok) setStatus('ok', '✔ Nilai sudah tercatat di gurumu.');
      else throw new Error((j && j.error) || 'respons tidak dikenal');
    }).catch(function () {
      // respons tidak bisa dibaca (mis. diblokir CORS) -> kirim sekali lagi tanpa membaca respons.
      // attemptId yang sama mencegah baris ganda di Sheet.
      postJson({ mode: 'no-cors' }).then(function () {
        setStatus('unsure', 'Nilai dikirim, tetapi belum dapat dikonfirmasi. Jika ragu, tunjukkan layar ini kepada gurumu.', true);
      }).catch(function () {
        setStatus('fail', 'Gagal mengirim (periksa koneksi internet). Tunjukkan layar ini kepada gurumu dan coba lagi.', true);
      });
    });
  }

  // -------------------------------------------------------------- hasil
  function barLine(name, ok, total) {
    var pct = total ? Math.round(ok / total * 100) : 0;
    return el('div', { class: 'bar-line' }, el('span', null, name), el('div', { class: 'track' }, el('i', { style: 'width:' + pct + '%' })), el('span', { class: 'val' }, ok + '/' + total));
  }
  function message(pct) {
    if (pct >= 85) return ['Luar biasa! 🎉', 'Kemampuan membacamu sudah kuat. Pertahankan dengan latihan teks baru.'];
    if (pct >= 70) return ['Bagus! 👍', 'Sebagian besar sudah tepat. Pelajari pembahasan soal yang salah.'];
    if (pct >= 55) return ['Cukup baik 🙂', 'Fondasinya ada. Fokus pada jenis soal yang paling sering salah.'];
    return ['Ayo berlatih lagi 💪', 'Baca pembahasan dengan teliti, lalu ulangi simulasi ini.'];
  }

  function renderResult() {
    var res = state.result;
    clearApp();
    window.scrollTo(0, 0);
    ribbon.classList.toggle("hidden", canSend());
    var m = message(res.pct);

    var chips = el('div', { class: 'chips', role: 'navigation', 'aria-label': 'Nomor soal' });
    DATA.items.forEach(function (it) {
      chips.append(el('button', { class: 'chip ' + (res.per[it.no - 1] ? 'ok' : 'bad'), type: 'button', 'aria-label': 'Soal ' + it.no + (res.per[it.no - 1] ? ' benar' : ' salah'), onclick: function () { showAll(); goTo(it.no); } }, String(it.no)));
    });
    var bar = el('div', { class: 'bar' }, el('div', { class: 'bar-in' },
      el('div', { class: 'bar-row' }, el('span', { class: 'who' }, state.student.nama + ' · ' + state.student.kelas), el('span', { class: 'count' }, 'Skor ' + res.score + '/' + res.total)),
      chips));

    var ring = el('div', { class: 'ring', role: 'img', 'aria-label': 'Skor ' + res.pct + ' dari 100' }, el('div', null, el('div', null, el('b', null, String(res.pct)), el('span', null, res.score + '/' + res.total + ' benar'))));
    ring.style.setProperty('--p', String(res.pct));

    var filter = el('div', { class: 'filter', role: 'radiogroup', 'aria-label': 'Filter pembahasan' }, el('span', null, 'Tampilkan:'));
    [['all', 'Semua soal'], ['bad', 'Hanya yang salah']].forEach(function (f) {
      filter.append(el('label', null, el('input', { type: 'radio', name: 'flt', value: f[0], checked: f[0] === 'all', onchange: function () { state.filter = f[0]; applyFilter(); } }), f[1]));
    });

    var result = el('section', { class: 'result', id: 'result' },
      el('div', { class: 'score-row' }, ring,
        el('div', { class: 'res-msg' },
          el('h2', null, m[0]),
          el('p', null, el('b', null, state.student.nama), ' · ' + state.student.kelas + (state.student.absen ? ' · absen ' + state.student.absen : '')),
          el('p', null, m[1]),
          state.auto ? el('p', null, el('b', null, state.autoWhy === 'strikes' ? 'Batas pelanggaran tercapai — jawabanmu dikumpulkan otomatis.' : 'Waktu habis — jawabanmu dikumpulkan otomatis.')) : null,
          (state.leaves + state.trans) > 0 ? el('p', { class: 'integrity' }, 'Catatan untuk guru: keluar halaman ' + state.leaves + '× (total ' + state.leaveSecs + ' detik), terjemahan terdeteksi ' + state.trans + '×.') : null)),
      el('div', { class: 'bars' },
        el('h3', null, 'Per keterampilan'),
        res.bySkill.map(function (b) { return barLine(b.name, b.ok, b.total); }),
        el('h3', null, 'Per jenis teks'),
        res.byText.map(function (b) { return barLine(b.name, b.ok, b.total); })),
      el('div', { class: 'status', id: 'status', role: 'status', 'aria-live': 'polite' }),
      el('div', { class: 'actions' },
        el('button', { class: 'btn', type: 'button', onclick: function () { var r = document.getElementById('review'); if (r) r.scrollIntoView(); } }, 'Lihat pembahasan ↓'),
        el('button', { class: 'btn secondary', type: 'button', onclick: copySummary }, 'Salin ringkasan hasil'),
        el('button', { class: 'btn secondary', type: 'button', onclick: function () { window.print(); } }, 'Cetak'),
        el('button', { class: 'btn secondary', type: 'button', onclick: function () { showStart(); } }, 'Ulangi simulasi')));

    var review = el('div', { id: 'review' },
      el('div', { class: 'panel', style: 'margin-top:26px' }, el('h2', null, 'Pembahasan'), el('p', null, 'Hijau = kunci jawaban. Merah = jawabanmu yang kurang tepat. Baca penjelasan di bawah tiap soal.'), filter),
      DATA.texts.map(function (t) { return renderSection(t, 'review'); }));

    app.append(bar, el('div', { class: 'wrap' }, result, review, el('footer', { class: 'note' }, DATA.meta.title + ' · latihan mandiri')));
    setStatus('sending', '…');
    // updateProgress tidak dipakai pada layar hasil
  }

  function applyFilter() {
    var cards = document.querySelectorAll('#review .q');
    Array.prototype.forEach.call(cards, function (c) {
      c.classList.toggle('hidden', state.filter === 'bad' && c.getAttribute('data-ok') === '1');
    });
    Array.prototype.forEach.call(document.querySelectorAll('#review .section'), function (s) {
      var vis = s.querySelectorAll('.q:not(.hidden)').length;
      s.classList.toggle('hidden', vis === 0);
    });
  }
  function showAll() {
    if (state.filter !== 'all') {
      state.filter = 'all';
      var r = document.querySelector('.filter input[value="all"]');
      if (r) r.checked = true;
      applyFilter();
    }
  }

  function copySummary() {
    var r = state.result;
    var txt = DATA.meta.title + '\nNama: ' + state.student.nama + '\nKelas: ' + state.student.kelas +
      (state.student.absen ? '\nAbsen: ' + state.student.absen : '') + '\nSkor: ' + r.score + '/' + r.total + ' (' + r.pct + ')\n' +
      r.bySkill.map(function (b) { return b.name + ' ' + b.ok + '/' + b.total; }).join(', ') + '\nWaktu: ' + new Date().toLocaleString('id-ID');
    function fallback() {
      var ta = el('textarea', { style: 'position:fixed;opacity:0' }); ta.value = txt; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (e) { /* abaikan */ }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).catch(fallback); else fallback();
    var s = document.getElementById('status');
    if (s) { var old = s.textContent; var cls = s.className; setTimeout(function () { s.className = cls; }, 0); s.dataset.copied = '1'; }
    alert('Ringkasan hasil disalin.');
  }

  // test hook (hanya membaca; tidak membuka kunci)
  window.__tka = { state: function () { return state; } };

  showStart();
})();

</script>
